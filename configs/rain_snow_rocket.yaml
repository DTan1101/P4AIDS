experiment:
  name: rocket
  output_dir: outputs/results/rocket
  seed: 42

data:
  prepared_path: outputs/data/windows.npz

missing:
  cache_dir: outputs/masks
  seed: 123

rocket:
  variant: mini
  use_mask_delta: true

  n_jobs: 2
  max_fit_samples: 2500
  transform_batch_size: 512
  max_feature_mib: 1024

  n_kernels: null

  kernel_defaults:
    mini: 1008
    multi: 336

  alphas: [0.1, 1.0, 10.0]

  class_weight: balanced
  tune_threshold: true
  imputer: linear

  channels:
    - temperature
    - humidity
    - wind
    - pressure
    - visibility
